name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The unit tests cover the RCON parsers, chat, console filters, plugin tables and schedules.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Builds the shrunk (R8) release too, so a rule that breaks it shows up here and not on a phone.
      # Without a keystore.properties it is signed with the debug key: fine for testing, not for Google Play.
      - name: Build release APK and bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bunker-android-test-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
